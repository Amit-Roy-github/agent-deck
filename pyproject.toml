[project]
name = "agent-deck"
version = "0.1.0"
description = "A control deck for AI teams — channel = team, interchangeable human/agent manager, first-class ownership/permissions."
requires-python = ">=3.10"

# Runtime stack (locked in findings.md). Phase 1 code below uses only the
# standard library; these land as later phases wire them in.
# Floors pinned to the latest release verified on PyPI (2026-07-12).
dependencies = [
    "langgraph>=1.2.9",
    "langchain>=1.3.13",
    "langchain-anthropic>=1.4.8",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-store-mongodb>=0.3.0",
    "pymongo>=4.17.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_deck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
